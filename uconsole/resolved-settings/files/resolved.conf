# /usr/lib/systemd/resolved.conf.d/50-uconsole.conf: resolved resolves the
# names of .local (nss-resolve of nsswitch.conf) and does not answer:
# avahi announces the uConsole and its services on port 5353, and the
# programs that browse by avahi (CUPS, gvfs, PipeWire) keep it.
[Resolve]
MulticastDNS=resolve
