# /usr/lib/systemd/zram-generator.conf.d/50-uconsole.conf: a swap in
# compressed memory of 1.5 GiB (zram-generator, systemd-zram-setup@zram0),
# zstd as the kernel takes by default (CONFIG_ZRAM_DEF_COMP_ZSTD). A file
# of /etc/systemd/zram-generator.conf.d/ changes it.
[zram0]
zram-size = 1536
compression-algorithm = zstd
