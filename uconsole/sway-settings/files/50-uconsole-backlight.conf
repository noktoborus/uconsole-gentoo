# /etc/sway/config.d/50-uconsole-backlight.conf: the backlight of the
# panel by /usr/bin/backlight (logind, no root). The sway of the login
# screen includes it too. Set the keys of the keyboard if it has others
# (wev shows the name of a key).
bindsym XF86MonBrightnessUp exec backlight up
bindsym XF86MonBrightnessDown exec backlight down
