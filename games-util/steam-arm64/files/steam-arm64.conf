# Settings of /usr/bin/steam, the launcher of the arm64 client of Steam.
# The environment wins over this file.

# The manifest of the first install: stable or publicbeta. publicbeta
# writes package/beta in the Steam root; after that the client keeps the
# channel itself (Settings, Interface, Client Beta Participation).
STEAM_ARM64_CHANNEL=@CHANNEL@

# The host of the manifests and the packages of Valve.
STEAM_ARM64_CDN=https://client-update.fastly.steamstatic.com
