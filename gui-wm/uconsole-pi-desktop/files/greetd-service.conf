# /etc/systemd/system/greetd.service.d/00gentoo.conf: greetd takes the
# configuration of the uConsole; /etc/greetd/config.toml belongs to
# gui-libs/greetd. It runs on VT 1 in place of the getty there, after
# Plymouth quit and left its picture (plymouth-quit.service.d).
[Unit]
Conflicts=getty@tty1.service
After=getty@tty1.service plymouth-quit.service plymouth-quit-wait.service

[Service]
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/greetd/uconsole.toml
