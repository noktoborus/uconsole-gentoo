# /etc/systemd/system/plymouth-quit.service.d/00gentoo.conf: Plymouth
# quits at the end of the boot and leaves its last picture on the screen;
# greetd starts after it (greetd.service.d), and the sway of the greeter
# draws over the picture, with no black screen between.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
