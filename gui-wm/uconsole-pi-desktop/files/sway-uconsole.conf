# /etc/sway/config.d/50-uconsole.conf: sway on the uConsole, for each user.
# /etc/sway/config includes /etc/sway/config.d/*; a ~/.config/sway/config
# made from it keeps that line.

# The services of the user (gvfs, portals, autostart) get the display of
# this sway, then the session starts: sway-session.target brings up
# xdg-desktop-autostart.target, and systemd runs /etc/xdg/autostart as
# services, the agent of polkit (polkit-gnome) and blueman-applet among
# them. sway itself does not read /etc/xdg/autostart.
exec systemctl --user import-environment WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP SSH_AUTH_SOCK
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway SSH_AUTH_SOCK
exec systemctl --user start sway-session.target

# Lock after 5 minutes, the panel off after 10, lock before a sleep.
exec swayidle -w \
    timeout 300 'swaylock -f -c 000000' \
    timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep 'swaylock -f -c 000000'

# The backlight, by /usr/bin/backlight (logind, no root). The keys
# are the usual ones; set those of the keyboard if it has others
# (wev shows the name of a key).
bindsym XF86MonBrightnessUp exec backlight up
bindsym XF86MonBrightnessDown exec backlight down

# A short press of the power key: lock and the panel off, or the panel
# on (logind leaves it to sway; a press of 5 s powers off).
bindsym --locked --release XF86PowerOff exec uconsole-screen-toggle lock

# The menu of programs: rofi with the desktop files, in place of the
# wmenu-run of /etc/sway/config (Super+d).
bindsym $mod+d exec rofi -show drun

# The volume of the default output of PipeWire, up to 100 %, also while
# locked.
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# The notifications of swaync (swaync.service of the user): the center of
# them by Super+n.
bindsym $mod+n exec swaync-client -t -sw

# Screenshots: Print a region into the clipboard, Shift+Print the screen
# into the folder of pictures (xdg-user-dirs).
bindsym Print exec grim -g "$(slurp)" - | wl-copy
bindsym Shift+Print exec grim "$(xdg-user-dir PICTURES)/screenshot-$(date +%Y%m%d-%H%M%S).png"

# Thunar in the background: windows open at once, and thunar-volman
# mounts what is plugged in (Thunar, Preferences, Advanced: "Configure
# the management of removable drives and media").
exec thunar --daemon

# waybar in place of swaybar: the bar of /etc/sway/config has no id, so
# sway names it bar-0; this file comes after it. sway runs waybar with
# "-b bar-0", which waybar takes (sway-bar(5), swaybar_command).
bar bar-0 swaybar_command waybar
