# The panel of the uConsole is DSI-1 on the CM4 and DSI-2 on the CM5
# (clockwork-uconsole/notes/display-cm5.md). One output command takes one name, so the common
# settings go into a variable. Sway keeps the settings of an output that is
# not there, and uses them when it appears.
#
# It goes to /etc/sway/config.d/40-uconsole-output.conf: /etc/sway/config
# includes it for each user, and the sway of greetd includes it too.

set $panel transform 90 scale 1

output DSI-1 $panel
output DSI-2 $panel
