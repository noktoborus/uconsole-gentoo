# /etc/sway/config.d/50-uconsole-bindings.conf: the lid of the uConsole,
# a short press of the power key (SW_LID, patch 0016 of the kernel): the
# panel off when it closes, on when it opens. The sway of the login screen
# includes it too (/etc/greetd/sway-config).
bindswitch --locked lid:off output '*' power on
bindswitch --locked lid:on output '*' power off
