# /usr/lib/systemd/logind.conf.d/50-uconsole.conf: the power key of the
# uConsole (the key PEK of the AXP228, axp20x-pek). A short press is left
# to sway; a press of 5 s powers off. The AXP228
# itself cuts the power after 10 s (60-uconsole-power-key.rules).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
