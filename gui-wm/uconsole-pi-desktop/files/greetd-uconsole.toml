# /etc/greetd/uconsole.toml: greetd runs the greeter as the user greetd
# (acct-user/greetd, in the group video), on VT 7, out of the way of the
# getty of tty1. The greeter is gtkgreet in a sway of its own.
# config.toml of gui-libs/greetd stays as it is: greetd.service takes this
# file (greetd.service.d/00gentoo.conf).
#
# The session of a user takes the PAM service uconsole-greetd: the password
# of the login unlocks the keyring (/etc/pam.d/uconsole-greetd). The
# greeter keeps greetd of gui-libs/greetd. No user logs in with no
# password.

[terminal]
vt = 7

[general]
service = "uconsole-greetd"

[default_session]
command = "sway --config /etc/greetd/sway-config"
user = "greetd"
service = "greetd"
