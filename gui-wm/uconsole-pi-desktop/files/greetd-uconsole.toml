# /etc/greetd/uconsole.toml: greetd runs the greeter as the user greetd
# (acct-user/greetd, in the group video), on VT 1, where Plymouth shows
# the boot; no getty there (greetd.service.d), so nothing clears it
# between. The text logins are on tty2 and up. The greeter is gtkgreet in
# a sway of its own.
# config.toml of gui-libs/greetd stays as it is: greetd.service takes this
# file (greetd.service.d/00gentoo.conf).
#
# The PAM service is greetd of gui-libs/greetd: system-login, where
# pambase gnome-keyring puts pam_gnome_keyring, so the password of the
# login unlocks the keyring. No user logs in with no password.

[terminal]
vt = 1

[default_session]
command = "sway --config /etc/greetd/sway-config"
user = "greetd"
