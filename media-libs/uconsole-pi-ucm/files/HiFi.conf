# The speakers or the headphones, one at a time. The jack on GPIO10 makes
# Headphones available; WirePlumber takes the device of the higher
# priority, and the switch of its pin. With Speaker Switch off the driver
# powers the amplifier of the speakers (GPIO11) down.
SectionVerb {
	EnableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Headphones Switch' off"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	ConflictingDevice [
		"Headphones"
	]
	EnableSequence [
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Speaker Switch' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Headphones Switch' on"
	]
	DisableSequence [
		cset "name='Headphones Switch' off"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId}"
		JackControl "Headphones Jack"
	}
}
