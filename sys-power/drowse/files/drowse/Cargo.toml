[package]
name = "drowse"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
libsystemd-sys = "0.10.0"
rust-i18n = "4.2.4"
rustix = { version = "1.1.6", default-features = false, features = ["process", "std", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
shlex = "2.0.1"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "sync", "net"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy", "service"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[profile.release]
lto = "fat"
codegen-units = 1

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros", "time", "sync", "net"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy", "service", "p2p"] }
