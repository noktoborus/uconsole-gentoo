#
# cm5-powersave-no-radio: the profile of TuneD cm5-powersave, and every
# radio off (Wi-Fi, Bluetooth, a modem): a deeper step of the power save
# while the system is idle. A stage of drowsed sets it, and gives the
# profile back by a restart of tuned-ppd.
#
# It is not in /etc/tuned/ppd.conf, as cm5-powersave is not.
#
# An example of drowse. If tuned-adm list does not show it, copy its
# directory to /etc/tuned/profiles/, with that of cm5-powersave, to use
# it.
#

[main]
summary=cm5-powersave, and every radio off
include=cm5-powersave

# Every radio off by its soft block of rfkill: rfkill-off.sh.
# An instance of the plugin script of its own, so the scripts of
# cm5-powersave and of powersave still run.
[cm5_radio]
type=script
script=${i:PROFILE_DIR}/rfkill-off.sh
