#
# cm5-powersave: the profile of TuneD for a Raspberry Pi 5 or CM5 (the
# BCM2712) while the system is idle. drowsed sets it by the first stage
# on battery (/etc/drowse.conf) and gives the profile back by a restart
# of tuned-ppd.
#
# It is not in /etc/tuned/ppd.conf, and must not be: tuned-ppd then shows
# it as "unknown" and keeps the profile the user chose (its base
# profile). A restart of tuned-ppd sets that profile again.
#
# An example of drowse. If tuned-adm list does not show it, copy its
# directory to /etc/tuned/profiles/ to use it.
#

[main]
summary=A Raspberry Pi CM5 idle: the CPU at 800 MHz at most, USB autosuspend but the keyboard, rare writeback, runtime PM of PCI, printing and maintenance stopped
include=powersave

# The CPU at 800 MHz at most. cpufreq keeps the value inside the range of
# the firmware: with the default arm_freq_min of the CM5 (1500) the
# lowest is 1500 MHz and this line does nothing; set arm_freq_min=800 or
# lower in config.txt. TuneD writes the value before back when the
# profile ends.
#
# Runtime PM of every PCI device: the kernel may put a device in D3 when
# its driver allows it. A PCI driver allows it by a call of its own in
# its probe; nvme and RP1 make none, and a PCIe port sets it itself. So
# on a CM5 with NVMe this is likely no gain; it costs nothing either.
[sysfs]
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq=800000
/sys/bus/pci/devices/*/power/control=auto

# The dirty pages go to the disk once a minute, not every 15 s (powersave)
# or 5 s (the kernel): the disk and the CPU wake less. A power cut or a
# crash loses up to a minute of writes.
[sysctl]
vm.dirty_writeback_centisecs=6000
vm.dirty_expire_centisecs=6000

# The services that need not run while nobody uses the system: printing
# and the timers of maintenance. TuneD keeps whether each one ran, and
# starts it again when the profile ends; a timer with Persistent=true
# then runs the job it missed. A service the system lacks is an error in
# the log of TuneD and nothing more.
[service]
service.cups=stop
service.fstrim.timer=stop
service.systemd-tmpfiles-clean.timer=stop

# USB autosuspend on every device but the keyboard and the hubs it hangs
# on: usb-autosuspend.sh.
# An instance of the plugin script of its own, so the script of powersave
# still runs.
[cm5_usb]
type=script
script=${i:PROFILE_DIR}/usb-autosuspend.sh
