<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  drowsed: the state on the bus, for reading only.
  Anyone reads the state (/io/github/noktoborus/Drowse).
  Only root and the group wheel read what holds the system up
  (/io/github/noktoborus/Drowse/HeldBy).
  To give it to another group, put a file of your own in
  /etc/dbus-1/system.d/ with a <policy group="..."> as the one of wheel.
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.noktoborus.Drowse"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.noktoborus.Drowse"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.noktoborus.Drowse"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.noktoborus.Drowse"
           send_interface="org.freedesktop.DBus.Peer"/>
    <deny send_destination="io.github.noktoborus.Drowse"
          send_path="/io/github/noktoborus/Drowse/HeldBy"/>
    <deny receive_sender="io.github.noktoborus.Drowse"
          receive_path="/io/github/noktoborus/Drowse/HeldBy"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="io.github.noktoborus.Drowse"
           send_path="/io/github/noktoborus/Drowse/HeldBy"/>
    <allow receive_sender="io.github.noktoborus.Drowse"
           receive_path="/io/github/noktoborus/Drowse/HeldBy"/>
  </policy>

  <policy user="root">
    <allow send_destination="io.github.noktoborus.Drowse"
           send_path="/io/github/noktoborus/Drowse/HeldBy"/>
    <allow receive_sender="io.github.noktoborus.Drowse"
           receive_path="/io/github/noktoborus/Drowse/HeldBy"/>
  </policy>
</busconfig>
