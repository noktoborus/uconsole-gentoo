# /etc/drowse.yaml: the settings of drowsed.
#
# With no chains, the service does nothing. A time is seconds or text:
# 90, 2m, 1h 30min, never.
#
# On battery: enter the power save at 10 min of idle. 38 min later, the
# announce starts; 2 min after it, the power save is left and the system
# powers off, at 50 min of idle. On AC, nothing.

# The least level of the journal written: debug, info, notice or
# warning. `drowsed --verbosity <level>` overrides it. debug adds the
# lines of a count that changes nothing: idle, its cancel, a wait.
verbosity: info

sessions:
  classes: [user, user-early, user-light, user-early-light, greeter]

sections:
  - &mute-powersave
    after: 10m
    enter: /usr/libexec/drowse/drowsed-tuned enter cm5-powersave-no-radio
    leave: /usr/libexec/drowse/drowsed-tuned leave
    hint: radio off

main:
  battery:
    - after: 10m
      enter: /usr/libexec/drowse/drowsed-tuned enter cm5-powersave
      leave: /usr/libexec/drowse/drowsed-tuned leave
      hint: power save
    - after: 38m
      countdown: 2m
      action: poweroff
  ac: []

# The chains of lid: are used with the lid closed. This example turns the
# radio off too at once, then powers off 10 min later. A first section
# with the same enter and leave as the section entered would carry it
# over with no command run; here the commands differ, so the power save
# is left and this one entered.
# lid:
#   battery:
#     - <<: *mute-powersave
#       after: 0
#     - action: poweroff
#       after: 10m
#       countdown: never
