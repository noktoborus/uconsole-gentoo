# /etc/drowse.conf: the settings of drowsed.
#
# A section a stage; the power source now picks the stages. The first
# stage on battery is [IdleBattery], the next ones [IdleBattery-1],
# [IdleBattery-2], ...; the same for [IdleAC]. A change of this file
# restarts drowsed.
#
# With no file the service does nothing: the default IdleTime is Never.
# A key not set takes its default, shown here in a comment. The lines
# that are not comments are the stages this package gives.
#
# The keys of a stage:
#   IdleTime    idle time before the announce: a time or Never
#   Countdown   how long the announce runs before the action, added to
#               IdleTime: a time or Never (no announce)
#   Action      the entry into the stage: an action of logind (poweroff,
#               suspend, hibernate, suspend-then-hibernate, ...) or a
#               command, with no shell; none: the entry does nothing
#   ActionHint  the name of the action on the bus and in the panel
#   Resume      a command run when the stage is left: before the next
#               stage is entered, or when the user is back; not after
#               an Action that failed; a command has 5 s to run
#
# One stage at most is entered at a time: the stage before is left (its
# Resume runs, and is waited for) before the next one is entered.
#
# A time: 90, 2m, 1h 30min (s, sec, m, min, h, hr), or Never.

# The sessions that count in the idle state, by their class of logind.
#   Classes     the classes that count, split by spaces; a session of
#               another class is left out, and empty leaves out all of
#               them. Any name is taken as it is, unchecked.
#
# The default is the classes logind itself counts in its idle state:
#   user              a user logged in: a graphical session, a console, ssh
#   user-early        the same for root, before systemd-user-sessions
#   user-light        a user session with no service manager of the user
#   user-early-light  user-early with no service manager of the user
#   greeter           the login screen
# A login screen that sets no idle hint (sway with no swayidle idlehint)
# is never idle, and keeps the system up while it is shown. Leave greeter
# out to let the system go idle with nobody logged in.
#
# The other classes (background, lock-screen, manager, ...) have no input
# of a user. All the classes logind knows (systemd 256 and later; the
# names there have "_" where this key has "-": user_early is user-early):
#   varlinkctl introspect /run/systemd/io.systemd.Login io.systemd.Login
# The class of each session now:
#   loginctl list-sessions

[Sessions]
#Classes=user user-early user-light user-early-light greeter

# The defaults of a stage:
#   IdleTime=Never
#   Countdown=2m
# Action and Resume have none.

# On battery: power save at 10 min of idle, with no announce. Then 38 min
# later the announce; 2 min after it the power save is left (its Resume)
# and the system powers off: at 50 min of idle.
#
# The power save is the profile of TuneD cm5-powersave: the CPU at
# 800 MHz at most, USB autosuspend, the dirty pages written once a
# minute, printing and the timers of maintenance stopped. A deeper step
# can be cm5-powersave-no-radio: the same, and every radio off. The
# package gives them as examples; if tuned-adm list does not show
# cm5-powersave, copy it:
#   cp -r /usr/share/doc/drowse-*/examples/tuned/cm5-powersave \
#       /etc/tuned/profiles/
# It is not a profile of tuned-ppd, so tuned-ppd keeps the profile the
# user chose; when the stage is left, its restart sets that profile
# again. With no tuned the command fails,
# the journal says so, and the poweroff still comes. With tuned and no
# tuned-ppd nothing gives the profile back: set Resume to
# tuned-adm profile <the profile>.

[IdleBattery]
IdleTime=10m
Countdown=Never
Action=tuned-adm profile cm5-powersave
ActionHint=power save
Resume=systemctl try-restart tuned-ppd.service

[IdleBattery-1]
IdleTime=38m
Countdown=2m
Action=poweroff

# On AC: nothing.

[IdleAC]
IdleTime=Never
