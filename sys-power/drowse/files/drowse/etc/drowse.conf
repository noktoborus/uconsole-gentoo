# /etc/drowse.conf: the settings of drowsed.
#
# A section a stage; the power source now picks the stages. The first
# stage on battery is [IdleBattery], the next ones [IdleBattery-1],
# [IdleBattery-2], ...; the same for [IdleAC]. A key not set takes its
# default, shown here; every line of this file is a comment, so the
# defaults apply. A change of this file restarts drowsed.
#
# The keys of a stage:
#   IdleTime    idle time before the announce: a time or Never
#   Countdown   how long the announce runs before the action, added to
#               IdleTime: a time or Never (no announce)
#   Action      an action of logind (poweroff, suspend, hibernate,
#               suspend-then-hibernate, ...) or a command, with no shell
#   ActionHint  the name of the action on the bus and in the panel
#   Resume      a command that undoes a command of Action when the user
#               is back; a command has 5 s to run
#
# A time: 90, 2m, 1h 30min (s, sec, m, min, h, hr), or Never.

[IdleBattery]
#IdleTime=15m
#Countdown=2m
#Action=poweroff

[IdleAC]
#IdleTime=60m
#Countdown=2m
#Action=poweroff

# An example of stages on battery: power save at once, the radio off at
# 5 min, then the announce of poweroff 30 min later.
#
#[IdleBattery]
#IdleTime=0
#Countdown=Never
#Action=tuned-adm profile powersave
#ActionHint=power save
#Resume=tuned-adm auto_profile
#
#[IdleBattery-1]
#IdleTime=5m
#Countdown=Never
#Action=nmcli radio all off
#ActionHint=radio off
#Resume=nmcli radio all on
#
#[IdleBattery-2]
#IdleTime=30m
#Countdown=2m
#Action=poweroff
